name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Restore permanent APK signing key
        run: |
          base64 --decode signing/roverd-update.p12.b64 > signing/roverd-update.p12
          echo "a9c266a7f03a029bbd221c1a1994b25da9bfbbab05f44ac90cd0d8f8e5836c41  signing/roverd-update.p12" | sha256sum -c -

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk roverd-android-debug.apk

      - name: Publish latest debug APK
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f latest-debug "$GITHUB_SHA"
          git push origin refs/tags/latest-debug --force

          if gh release view latest-debug >/dev/null 2>&1; then
            gh release upload latest-debug roverd-android-debug.apk --clobber
          else
            gh release create latest-debug roverd-android-debug.apk \
              --title "Latest Debug Build" \
              --notes "Automatically built debug APK from the latest main branch commit." \
              --prerelease
          fi
